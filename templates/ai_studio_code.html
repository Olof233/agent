<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agent Report Evaluator</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body {
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #f0f2f5;
    margin: 0;
  }
  .container {
    background: #fff;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    width: 90%;
    max-width: 1200px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
  }
  .input-section, .output-section {
    display: flex;
    flex-direction: column;
  }
  button {
    padding: 8px 16px;
    background-color: #4285f4;
    color: white;
    border: grey;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    transition: background-color 0.3s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  button:hover {
    background-color: #3367d6;
  }
  .container h1 {
    color: #333;
    text-align: center;
    width: 100%;
    margin: 20px 0;
    grid-column: span 2; /* 确保标题跨越两列 */
  }
</style>
</head>
<body>


<div class="container">
  <h1>AI Agent Studio</h1>
  <div class="input-section" style="grid-column: span 2; display: flex; justify-content: center; align-items: center;">
    <div style="display: flex; gap: 16px;">
      <button id="eva-btn" style="height: 36px;">内容评估agent</button>
      <button id="gen-btn" style="height: 36px;">方案生成agent</button>
    </div>
  </div>
</div>

<script>
document.getElementById('eva-btn').addEventListener('click', function() {
  window.location.href = '/eva';
})
</script>

<script>
document.getElementById('gen-btn').addEventListener('click', function() {
  window.location.href = '/gen';
})
</script>

</body>
</html>
